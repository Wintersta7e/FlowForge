name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Cancel superseded runs of the same event on the same ref; event_name keeps a
# scheduled or dispatched run on main from cancelling a push run, and the reverse.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet restore
      - name: Verify formatting
        run: dotnet format FlowForge.sln --verify-no-changes

  # Job name kept as "build-and-test" so the existing required status check
  # keeps being reported with zero branch-protection changes.
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet restore
      - name: Build (Release)
        run: dotnet build -c Release --no-restore
      - name: Test (Release, no rebuild)
        shell: bash
        run: |
          dotnet test -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=ci.trx" --results-directory TestResults/ci
          bash scripts/check-trx.sh TestResults/ci --require-prefix FlowForge.Tests.Visual.

  # Mirror of build-and-test on the actual release target (win-x64).
  build-and-test-windows:
    name: build-and-test-windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet restore
      - name: Build (Release)
        run: dotnet build -c Release --no-restore
      - name: Test (Release, no rebuild)
        shell: bash
        run: |
          dotnet test -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=ci.trx" --results-directory TestResults/ci
          bash scripts/check-trx.sh TestResults/ci --require-prefix FlowForge.Tests.Visual.

  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:TreatWarningsAsErrors=true
      - name: Report deprecated packages (informational)
        run: dotnet list package --deprecated --include-transitive || true
      - name: Report vulnerable packages (informational; suppressed advisories stay visible)
        run: dotnet list package --vulnerable --include-transitive || true
      - name: Every suppression must match a reported advisory
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vuln.json
          jq -r '[.projects[].frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[] | .vulnerabilities[]?.advisoryurl] | unique[]' vuln.json > found.txt
          for p in $(jq -r '.projects[].path' vuln.json); do
            dotnet msbuild "$p" -getItem:NuGetAuditSuppress | jq -r '.Items.NuGetAuditSuppress[]?.Identity'
          done | sort -u > suppressed.txt
          comm -13 found.txt suppressed.txt > stale.txt
          projects=$(jq '.projects | length' vuln.json)
          echo "projects: $projects; advisories: $(wc -l < found.txt); suppressed: $(wc -l < suppressed.txt); stale: $(wc -l < stale.txt)"
          if [ "$projects" -eq 0 ]; then echo "::error::Audit scanned zero projects"; exit 1; fi
          if [ -s stale.txt ]; then echo "::error::Suppression matches no reported advisory:"; cat stale.txt; exit 1; fi
